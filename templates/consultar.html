<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consultar Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Consultar Registro - Alcaldía Local de Kennedy</h1>
    </header>
    <div class="container">
        <h2>Buscar Registro por Identificación</h2>
        <form id="consultaForm">
            <label for="identificacion">Identificación:</label>
            <input type="text" id="identificacion" name="identificacion" required>
            <button type="submit">Buscar</button>
        </form>

        <div id="mensajeError" style="display: none; color: red; margin-top: 10px;"></div>

        <div id="informacionRegistro" style="display: none;">
            <h3>Información del Registro</h3>
            <table>
                <tr><th>Campo</th><th>Valor</th></tr>
                <tr><td>Apellido Paterno</td><td id="apellido_paterno"></td></tr>
                <tr><td>Apellido Materno</td><td id="apellido_materno"></td></tr>
                <tr><td>Nombres</td><td id="nombres"></td></tr>
                <tr><td>Identificación</td><td id="identificacion_valor"></td></tr>
                <tr><td>Fecha de Entrevista</td><td id="fecha_entrevista"></td></tr>
                <tr><td>Teléfono</td><td id="telefono"></td></tr>
                <tr><td>Perfil</td><td id="perfil"></td></tr>
                <tr>
                    <td>HV (Enlace)</td>
                    <td><a href="#" id="hv" target="_blank">Ver HV</a></td>
                </tr>
                <tr><td>Área</td><td id="area"></td></tr>
                <tr><td>Subgrupo</td><td id="subgrupo"></td></tr>
                <tr><td>Rol</td><td id="rol"></td></tr>
                <tr><td>Riesgo</td><td id="riesgo"></td></tr>
            </table>
        </div>

        <a href="{{ url_for('home') }}" class="button">Volver al Menú Principal</a>
    </div>

    <script>
        document.getElementById('consultaForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const identificacion = document.getElementById('identificacion').value;

            fetch("{{ url_for('consultar_registro') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({ 'identificacion': identificacion })
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('No se encontró ningún registro con esa identificación');
                }
            })
            .then(data => {
                if (data.success) {
                    // Mostrar la información del registro
                    document.getElementById('mensajeError').style.display = 'none';
                    document.getElementById('informacionRegistro').style.display = 'block';
                    document.getElementById('apellido_paterno').innerText = data.registro.apellido_paterno || "N/A";
                    document.getElementById('apellido_materno').innerText = data.registro.apellido_materno || "N/A";
                    document.getElementById('nombres').innerText = data.registro.nombres || "N/A";
                    document.getElementById('identificacion_valor').innerText = data.registro.identificacion || "N/A";
                    document.getElementById('fecha_entrevista').innerText = data.registro.fecha_entrevista || "N/A";
                    document.getElementById('telefono').innerText = data.registro.telefono || "N/A";
                    document.getElementById('perfil').innerText = data.registro.perfil || "N/A";
                    document.getElementById('hv').href = data.registro.hv || "#";
                    document.getElementById('hv').style.display = data.registro.hv ? "inline" : "none";
                    document.getElementById('area').innerText = data.registro.area || "N/A";
                    document.getElementById('subgrupo').innerText = data.registro.subgrupo || "N/A";
                    document.getElementById('rol').innerText = data.registro.rol || "N/A";
                    document.getElementById('riesgo').innerText = data.registro.riesgo || "N/A";
                }
            })
            .catch(error => {
                // Mostrar el mensaje de error si no se encuentra el registro
                document.getElementById('informacionRegistro').style.display = 'none';
                document.getElementById('mensajeError').innerText = error.message;
                document.getElementById('mensajeError').style.display = 'block';
            });
        });
    </script>
</body>
</html>
