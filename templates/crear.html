<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Nuevo Registro - Alcaldía Local de Kennedy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Crear Nuevo Registro - Alcaldía Local de Kennedy</h1>
    </header>
    <div class="container">
        <h2>Formulario de Registro</h2>
        <form action="{{ url_for('crear_registro') }}" method="post" onsubmit="showModal(event)">
            <!-- Campos del formulario -->
            <label for="apellido_paterno">Apellido Paterno:</label>
            <input type="text" id="apellido_paterno" name="apellido_paterno" required>

            <label for="apellido_materno">Apellido Materno:</label>
            <input type="text" id="apellido_materno" name="apellido_materno" required>

            <label for="nombres">Nombres:</label>
            <input type="text" id="nombres" name="nombres" required>

            <label for="identificacion">Identificación:</label>
            <input type="text" id="identificacion" name="identificacion" required>

            <label for="fecha_entrevista">Fecha de Entrevista:</label>
            <input type="date" id="fecha_entrevista" name="fecha_entrevista">

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono">

            <label for="perfil">Perfil:</label>
            <input type="text" id="perfil" name="perfil">

            <label for="hv">Enlace HV:</label>
            <input type="url" id="hv" name="hv">

            <!-- Lista desplegable para Área -->
            <label for="area">Área:</label>
            <select id="area" name="area" required onchange="updateSubgrupoOptions()">
                <option value="">Seleccione un área</option>
                <option value="Despacho">Despacho</option>
                <option value="Desarrollo Administrativo y Financiero">Desarrollo Administrativo y Financiero</option>
                <option value="Gestión Policiva y Jurídica">Gestión Policiva y Jurídica</option>
                <option value="Inspecciones de Policía">Inspecciones de Policía</option>
            </select>

            <!-- Lista desplegable para Subgrupo, dependiente de Área -->
            <label for="subgrupo">Subgrupo:</label>
            <select id="subgrupo" name="subgrupo" required>
                <option value="">Seleccione un subgrupo</option>
            </select>

            <!-- Lista desplegable para Rol -->
            <label for="rol">Rol:</label>
            <select id="rol" name="rol" required>
                <option value="">Seleccione un rol</option>
                <option value="Auxiliar">Auxiliar</option>
                <option value="Notificador">Notificador</option>
                <option value="Primaria">Primaria</option>
                <option value="Profesional Especializado">Profesional Especializado</option>
                <option value="Profesional Universitario">Profesional Universitario</option>
                <option value="Tecnico">Técnico</option>
                <option value="Transporte - Liviano">Transporte - Liviano</option>
                <option value="Transporte - Pesado">Transporte - Pesado</option>
            </select>

            <!-- Lista desplegable para Riesgo -->
            <label for="riesgo">Riesgo:</label>
            <select id="riesgo" name="riesgo" required>
                <option value="">Seleccione el nivel de riesgo</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>

            <button type="submit">Guardar Registro</button>
            <a href="{{ url_for('home') }}" class="button">Volver al Menú Principal</a>
        </form>
    </div>

    <!-- Modal de Confirmación -->
    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <p>El registro ha sido creado exitosamente.</p>
            <button onclick="redirectToHome()">Aceptar</button>
        </div>
    </div>

    <!-- JavaScript para manejar el modal y el formulario dependiente -->
    <script>
        // Función para mostrar el modal
        function showModal(event) {
            event.preventDefault();
            const form = event.target;

            fetch(form.action, {
                method: 'POST',
                body: new FormData(form)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('confirmationModal').style.display = 'block';
                } else {
                    alert('Ocurrió un error al guardar el registro.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        // Función para cerrar el modal
        function closeModal() {
            document.getElementById('confirmationModal').style.display = 'none';
        }

        // Función para redirigir al menú principal
        function redirectToHome() {
            window.location.href = "{{ url_for('home') }}";
        }

        // Función para actualizar opciones de subgrupo basadas en el área seleccionada
        function updateSubgrupoOptions() {
            const area = document.getElementById('area').value;
            const subgrupo = document.getElementById('subgrupo');
            subgrupo.innerHTML = '<option value="">Seleccione un subgrupo</option>';

            const options = {
                "Despacho": ["Despacho", "Desarrollo Estrategico y Mejora", "Jurídica", "Relacionamiento interinstitucional", "Comunicaciones"],
                "Desarrollo Administrativo y Financiero": ["Coordinación Administrativa y Financiera", "PIGA", "Servicios Generales y funcionamiento", "CDI y Atención al Usuario", "CPS y Planta", "TIC", "Gestión Documental", "Almacén", "Presupuesto", "Contabilidad"],
                "Gestión Policiva y Jurídica": ["Coordinación Policiva", "Actuaciones Administrativas", "Hechos Notorios", "Cobro Persuasivo", "Calle - Ambiente", "Calle - Seguridad", "Calle - Espacio Público", "Calle - Riesgos", "Calle - Seguridad - Gestor", "Kennedy a la Medida", "Demandas Mi casa me pertenece"],
                "Inspecciones de Policía": ["Coordinación", "Inspección - 8A", "Inspección - 8B", "Inspección - 8C", "Inspección - 8D", "Inspección - 8E", "Inspección - 8F", "Inspección - 8G"]
            };

            if (options[area]) {
                options[area].forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub;
                    option.textContent = sub;
                    subgrupo.appendChild(option);
                });
            }
        }
    </script>
</body>
</html>
