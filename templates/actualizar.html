<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Actualizar Registro - Alcaldía Local de Kennedy</h1>
    </header>
    <div class="container">
        <h2>Actualizar Información</h2>
        <form action="{{ url_for('actualizar_registro') }}" method="post">
            <label for="identificacion">Identificación:</label>
            <input type="text" id="identificacion" name="identificacion" required>

            <label for="campo">Campo a Actualizar:</label>
            <select id="campo" name="campo" required>
                <option value="apellido_paterno">Apellido Paterno</option>
                <option value="apellido_materno">Apellido Materno</option>
                <option value="nombres">Nombres</option>
                <option value="telefono">Teléfono</option>
                <option value="perfil">Perfil</option>
                <!-- Agrega más campos si es necesario -->
            </select>

            <label for="nuevo_valor">Nuevo Valor:</label>
            <input type="text" id="nuevo_valor" name="nuevo_valor" required>

            <button type="submit">Actualizar Registro</button>
            <a href="{{ url_for('home') }}" class="button">Volver al Menú Principal</a>
        </form>
    </div>
</body>
</html>
